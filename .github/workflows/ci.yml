name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows:
    name: Windows checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build
